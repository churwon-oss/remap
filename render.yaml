services:
  - type: web
    name: remap
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws-ping-interval 20 --ws-ping-timeout 60 --no-access-log
    envVars:
      - key: REMAP_RUNTIME
        value: render
      - key: REMAP_PUBLIC_BASE_URL
        value: https://remap-oxrv.onrender.com
      - key: REMAP_FORCE_PUBLIC_ORIGIN
        value: '1'
